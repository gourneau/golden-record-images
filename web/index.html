<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Voyager Golden Record · Image Decoder</title>
    <meta
      name="description"
      content="Decode the 116 images encoded in the audio of the Voyager Golden Record, in your browser, from the record's own signal."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230c0d0f'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23c8a052' stroke-width='1'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='none' stroke='%23c8a052' stroke-width='1'/%3E%3Cpath d='M16 1v6M16 25v6M1 16h6M25 16h6' stroke='%2378e0ce' stroke-width='1'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <!-- The DSP entry point replaces this plate once the catalog is in hand. -->
    <div id="app">
      <div class="boot" role="status">
        <div class="boot__mark" aria-hidden="true"></div>
        <p class="boot__line">Warming the decoder</p>
        <p class="boot__sub">Fetching the frame catalog and the first slice of record audio.</p>
      </div>
    </div>
    <noscript>
      <div class="boot">
        <p class="boot__line">This decoder needs JavaScript</p>
        <p class="boot__sub">
          The pictures are not files on this server. They are recovered from the record's audio in
          your browser, one column at a time, while you watch.
        </p>
      </div>
    </noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
